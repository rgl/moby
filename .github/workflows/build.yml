name: Build
on: [push]
jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build
        run: |
          set -euxo pipefail
          time docker buildx bake all --set *.platform=linux/amd64
          find bundles/binary/ -type f -exec ls -laF {} \;
          pushd bundles/binary
          tar czf ../../dockerd-docker-default-apparmor-profile.tgz dockerd
          popd
      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-artifacts
          path: |
            *.tgz
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Release
    runs-on: ubuntu-22.04
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
      - name: Release notes
        run: |
          echo "sha256 $(sha256sum docker-artifacts/*.tgz | awk '{print $1}')" >release-notes.md
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          bodyFile: release-notes.md
          artifacts: docker-artifacts/*.tgz
          token: ${{ secrets.GITHUB_TOKEN }}
